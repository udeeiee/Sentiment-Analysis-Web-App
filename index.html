<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sentiment Analyzer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <div class="container">
    <header class="header">
      <div class="logo">🧠</div>
      <h1>Sentiment Analyzer</h1>
      <p>Powered by NLP — Detect emotions in any text instantly</p>
    </header>

    <div class="card input-card">
      <label for="textInput">Enter your text below</label>
      <textarea id="textInput"
        placeholder="Type or paste any text here… e.g. 'This product is absolutely amazing! I love it.'"
        maxlength="2000" rows="6"></textarea>
      <div class="input-footer">
        <span id="charCount">0 / 2000</span>
        <button id="analyzeBtn" onclick="analyzeSentiment()">
          <span id="btnText">Analyze</span>
          <span id="btnLoader" class="loader hidden"></span>
        </button>
      </div>
    </div>

    <div class="samples">
      <span class="samples-label">Try a sample:</span>
      <button class="sample-btn pos" onclick="setSample('pos')">Positive</button>
      <button class="sample-btn neg" onclick="setSample('neg')">Negative</button>
      <button class="sample-btn neu" onclick="setSample('neu')">Neutral</button>
    </div>

    <div id="resultCard" class="card result-card hidden">
      <div class="result-top">
        <div id="resultEmoji" class="result-emoji">😐</div>
        <div class="result-info">
          <div id="resultLabel" class="result-label">Neutral</div>
          <div id="resultConfidence" class="result-confidence">Confidence: 50%</div>
        </div>
      </div>

      <div class="progress-bar-wrapper">
        <div class="progress-labels">
          <span>Negative</span><span>Positive</span>
        </div>
        <div class="progress-track">
          <div id="progressFill" class="progress-fill" style="width:50%"></div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-label">Words</div>
          <div id="statWords" class="stat-val">-</div>
        </div>
        <div class="stat-box pos-box">
          <div class="stat-label">Positive signals</div>
          <div id="statPos" class="stat-val">-</div>
        </div>
        <div class="stat-box neg-box">
          <div class="stat-label">Negative signals</div>
          <div id="statNeg" class="stat-val">-</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Sentiment density</div>
          <div id="statDensity" class="stat-val">-</div>
        </div>
      </div>

      <div id="keywordsSection" class="keywords-section">
        <div id="posKeywords" class="keyword-group"></div>
        <div id="negKeywords" class="keyword-group"></div>
      </div>
    </div>

    <div id="errorMsg" class="error-msg hidden"></div>

    <footer class="footer">
      Built by Uday Bhardwaj &nbsp;•&nbsp; BCA Final Year, Bennett University
    </footer>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
